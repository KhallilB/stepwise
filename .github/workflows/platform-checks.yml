name: Interview platform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install browser engines
        run: |
          if [ -d apps/interview-lab ]; then
            bun run --cwd apps/interview-lab test:install webkit
          else
            bunx playwright install --with-deps chromium
          fi
      - name: Check both apps and shared code
        run: bun run check
      - name: Build browser apps
        run: bun run build
      - name: Check built desktop frontend
        if: hashFiles('apps/desktop/package.json') != ''
        run: bun run --cwd apps/desktop test:e2e
