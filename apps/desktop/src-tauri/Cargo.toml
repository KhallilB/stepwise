[package]
name = "interview-practice"
version = "0.1.0-alpha.1"
edition = "2021"

[lib]
name = "interview_practice"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
libc = "0.2"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

# macOS loader rejects stripped host macro dylibs with current toolchain.
[profile.release.build-override]
strip = "none"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
